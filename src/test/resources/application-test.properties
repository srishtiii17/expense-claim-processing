# Settings used only by tests (activated with @ActiveProfiles("test")).
# Tests use a separate database so they never touch development data.
# Username and password still come from the DB_USERNAME / DB_PASSWORD environment variables.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/expense_claims_test}

# Tests sign tokens with a fresh random secret (64 hex characters) each time a test context starts,
# so no secret is ever written to a file and tests never depend on JWT_SECRET being set.
app.jwt.secret=${random.value}${random.value}
app.jwt.expiry=1h
