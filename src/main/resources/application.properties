spring.application.name=expense-claims

# ---------------------------------------------------------------------------
# Database connection
# Credentials are read from environment variables so they never appear in Git.
# DB_URL has a safe local default; DB_USERNAME and DB_PASSWORD have no default.
# If they are missing, Spring passes the literal text "${DB_USERNAME}" to PostgreSQL and
# startup fails with: password authentication failed for user "${DB_USERNAME}".
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_claims}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns the schema. Hibernate only checks ("validate") that the entity
# classes match the tables Flyway created; it never creates or alters tables.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
# Close the database session when the service method ends instead of keeping it
# open for the whole web request. This avoids hidden lazy-loading queries in controllers.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# JWT (see JwtProperties)
# JWT_SECRET signs and verifies login tokens. It has NO default on purpose: without it, or if it
# is shorter than 32 bytes, the application refuses to start. Never put the real value in a file.
# JWT_EXPIRY is how long a token stays valid (for example 30m, 1h, 8h). Default: 1 hour.
# ---------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiry=${JWT_EXPIRY:1h}
app.jwt.issuer=expense-claims
